name: Sync release

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Stable tag; empty means latest'
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: pcl-ce-release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
  PYTHONUTF8: '1'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
      - name: Check upstream
        id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: python release.py discover --output work/release.json --github-output "$env:GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.discover.outputs.needed == 'true' && steps.discover.outputs.reuse_release != 'true'
        with:
          dotnet-version: '10.0.402'
          architecture: x64
      - name: Prepare official binary
        if: steps.discover.outputs.needed == 'true' && steps.discover.outputs.reuse_release != 'true'
        run: |
          python -m pip install sigstore==4.5.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python release.py download --metadata work/release.json --output work/originals
      - name: Patch
        if: steps.discover.outputs.needed == 'true' && steps.discover.outputs.reuse_release != 'true'
        run: |
          $release = Get-Content work/release.json -Raw | ConvertFrom-Json
          dotnet restore PclCeRestore.csproj
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project PclCeRestore.csproj -c Release --no-restore -- patch --input work/originals/PCL2_CE_Release_x64.exe --output work/patched/x64/PCL_CE_Restore_x64.exe --feed-base $release.feedBase --revision $release.revision --report work/patched/x64/patch-report.json
      - name: Package and sign
        if: steps.discover.outputs.needed == 'true' && steps.discover.outputs.reuse_release != 'true'
        run: |
          python release.py assemble --metadata work/release.json --patched work/patched --output work/release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python release.py sign --directory work/release
      - name: Publish
        if: steps.discover.outputs.needed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python release.py publish --metadata work/release.json --directory work/release
