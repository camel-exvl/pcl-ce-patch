name: Sync and patch official release

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Optional stable tag, e.g. v2.15.1; empty means latest'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'profiles/**'
      - 'patch-config.json'
      - 'requirements-ci.txt'
      - 'global.json'
      - 'Directory.Build.props'
      - 'NuGet.Config'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: pcl-ce-release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
  PYTHONUTF8: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      needed: ${{ steps.discover.outputs.needed }}
      reuse_release: ${{ steps.discover.outputs.reuse_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
      - name: Test release orchestration
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Resolve stable release and check existing publication
        id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: python scripts/release.py discover --tag "$UPSTREAM_TAG" --output work/release.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.discover.outputs.needed == 'true'
        with:
          name: release-metadata
          path: work/release.json
      - name: Install signature verifier
        if: steps.discover.outputs.needed == 'true' && steps.discover.outputs.reuse_release != 'true'
        run: python -m pip install -r requirements-ci.txt
      - name: Download and verify original assets
        if: steps.discover.outputs.needed == 'true' && steps.discover.outputs.reuse_release != 'true'
        run: |
          python scripts/release.py download --metadata work/release.json --output work/originals
          python scripts/verify-inputs.py --directory work/originals
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.discover.outputs.needed == 'true' && steps.discover.outputs.reuse_release != 'true'
        with:
          name: official-originals
          path: work/originals/
          retention-days: 7

  patch:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true' && needs.prepare.outputs.reuse_release != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: ARM64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: work
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: official-originals
          path: work/originals
      - name: Build and test against official binary
        shell: pwsh
        env:
          PATCH_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content patch-config.json -Raw | ConvertFrom-Json
          $release = Get-Content work/release.json -Raw | ConvertFrom-Json
          dotnet restore tests/PclCeRestore.Tests/PclCeRestore.Tests.csproj --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/PclCeRestore.Tests -c Release --no-restore -- "work/originals/PCL2_CE_Release_$env:PATCH_ARCH.exe" $config.profile work/tmp $release.feedBase
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project src/PclCeRestore -c Release --no-restore -- patch --input "work/originals/PCL2_CE_Release_$env:PATCH_ARCH.exe" --output "work/patched/PCL_CE_Restore_$env:PATCH_ARCH.exe" --feed-base $release.feedBase --revision $release.revision --profile $config.profile --report work/patched/patch-report.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Start the patched WPF application
        shell: pwsh
        env:
          PATCH_ARCH: ${{ matrix.arch }}
        run: ./scripts/smoke.ps1 -Executable "work/patched/PCL_CE_Restore_$env:PATCH_ARCH.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patched-${{ matrix.arch }}
          path: work/patched/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: diagnostics-${{ matrix.arch }}
          path: work/smoke/**/Log*

  publish:
    needs: [prepare, patch]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.needed == 'true' && (needs.patch.result == 'success' || needs.prepare.outputs.reuse_release == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: work
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.prepare.outputs.reuse_release != 'true'
        with:
          name: patched-x64
          path: work/patched/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.prepare.outputs.reuse_release != 'true'
        with:
          name: patched-ARM64
          path: work/patched/ARM64
      - name: Assemble full update packages and source changes
        if: needs.prepare.outputs.reuse_release != 'true'
        run: python scripts/release.py assemble --metadata work/release.json --patched work/patched --output work/release
      - name: Sign and verify patched executables and update packages
        if: needs.prepare.outputs.reuse_release != 'true'
        env:
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
        run: |
          python -m pip install -r requirements-ci.txt
          for file in work/release/*.exe work/release/*.zip; do
            python -m sigstore sign --bundle "$file.sigstore.json" "$file"
            python -m sigstore verify identity --bundle "$file.sigstore.json" --cert-identity "$CERT_IDENTITY" --cert-oidc-issuer https://token.actions.githubusercontent.com "$file"
          done
          python scripts/release.py checksums --directory work/release
      - name: Publish complete release, then atomically advance update feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/release.py publish --metadata work/release.json --directory work/release
      - name: Report publication
        if: success()
        run: |
          python -c 'import json,os; d=json.load(open("work/release.json")); open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("Published "+d["releaseTag"]+"; update feed points to verified patched assets.\n")'
